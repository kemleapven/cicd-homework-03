version: '3.8'

services:
  web:
    image: 154560315950.dkr.ecr.us-east-1.amazonaws.com/cicd-web-app:${APP_VERSION:-v1.0.0}
    ports:
      - "5000:5000"
    environment:
      - APP_VERSION=${APP_VERSION:-v1.0.0}
      - APP_ENV=production
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - homework_net

networks:
  homework_net:
    driver: overlay
    attachable: true
